name: Meditation Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/whoop4-meditation-timer

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Get dependencies
        run: flutter pub get
      - name: Test meditation gesture
        run: flutter test test/gesture_controller_test.dart
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: openstrap-meditation-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
